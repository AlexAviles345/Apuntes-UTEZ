
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Tienda Online</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header class="header">
        <h1>Mi Tienda</h1>
        <p>Descubre nuestros productos</p>
    </header>

    <main class="container">
        <h2>Catálogo de productos</h2>

        <p id="mensaje" role="status">Cargando productos...</p>

        <section id="productos" class="productos">
            <!-- Los productos se cargan desde JavaScript -->
        </section>
    </main>

    <!-- Modal de detalles -->
    <div id="modal" class="modal" role="dialog"
         aria-modal="true" aria-labelledby="modal-titulo" hidden>

        <div class="modal-contenido">
            <button id="cerrar-modal" class="cerrar"
                    type="button" aria-label="Cerrar modal">
                &times;
            </button>

            <p id="modal-mensaje" role="status">Cargando producto...</p>

            <div id="detalle-producto"></div>
        </div>

    </div>

    <footer class="footer">
        <p>Mi Tienda Online &copy; 2026</p>
    </footer>

    <script src="script.js" defer></script>
    <script src="app.js" defer></script>
</body>
</html>
