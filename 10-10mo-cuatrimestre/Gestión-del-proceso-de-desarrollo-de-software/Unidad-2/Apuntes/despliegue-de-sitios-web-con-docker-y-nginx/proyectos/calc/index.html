<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
</head>
<body>

    <h1>Calculadora</h1>

    <input type="number" id="num1" placeholder="Número 1">
    <input type="number" id="num2" placeholder="Número 2">
    <input type="number" id="resultado" placeholder="Resultado" readonly>

    <button type="button" onclick="calcular(sumar)">Sumar</button>
    <button type="button" onclick="calcular(restar)">Restar</button>
    <button type="button" onclick="calcular(multiplicar)">Multiplicar</button>
    <button type="button" onclick="calcular(dividir)">Dividir</button>

    
    <script src="main.js"></script>
    <script>
        function calcular(operacion) {
            const num1 = Number.parseFloat(document.getElementById('num1').value);
            const num2 = Number.parseFloat(document.getElementById('num2').value);
            const resultado = document.getElementById('resultado');

            if (Number.isNaN(num1) || Number.isNaN(num2)) {
                resultado.value = 'Escribe los dos números';
                return;
            }

            try {
                resultado.value = operacion(num1, num2);
            } catch (error) {
                resultado.value = error.message;
            }
        }
    </script>
</body>
</html>
